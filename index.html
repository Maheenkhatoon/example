<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
    <title>Change Text and Color</title>
</head>
<body>

    <p id="myParagraph">This is the original text.</p>
    <button onclick="changeText()">Click Me</button>

    <script>
        function changeText() {
            const para = document.getElementById("myParagraph");
            para.textContent = "The text has been changed!";
            para.style.color = "blue";
        }
    </script>

</body>
</html>
   
    
</body>
</html>
